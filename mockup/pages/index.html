<title>nuGW 업무관리 플랫폼 — 화면 목업</title>
<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg:#F4F5F8;
    --surface:#FFFFFF;
    --surface-alt:#ECEEF3;
    --border:#DFE2EA;
    --border-strong:#C9CDD9;
    --text:#1B2036;
    --text-muted:#5B6178;
    --text-faint:#8A8FA3;
    --accent:#33427A;
    --accent-strong:#263066;
    --accent-soft:#E8EAF6;
    --on-accent:#FFFFFF;
    --success:#1E8A5F;
    --success-soft:#E3F3EA;
    --warning:#A9700A;
    --warning-soft:#FBF0DC;
    --danger:#C4433B;
    --danger-soft:#FBE6E4;
    --shadow-sm:0 1px 2px rgba(20,22,31,.07),0 1px 0 rgba(20,22,31,.03);
    --shadow-md:0 8px 24px rgba(20,22,31,.14),0 2px 6px rgba(20,22,31,.08);
    --r-sm:6px;
    --r-md:10px;
    --r-lg:16px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161F;
      --surface:#1C1F2C;
      --surface-alt:#232637;
      --border:#2B2F41;
      --border-strong:#3A3F57;
      --text:#E7E8EE;
      --text-muted:#9498AC;
      --text-faint:#6A6E82;
      --accent:#8C9AE8;
      --accent-strong:#AAB4EE;
      --accent-soft:#262C4A;
      --on-accent:#141726;
      --success:#4FBE8B;
      --success-soft:#183226;
      --warning:#E0A63B;
      --warning-soft:#332A14;
      --danger:#E38078;
      --danger-soft:#3A1E1C;
      --shadow-sm:0 1px 2px rgba(0,0,0,.5);
      --shadow-md:0 8px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161F;
    --surface:#1C1F2C;
    --surface-alt:#232637;
    --border:#2B2F41;
    --border-strong:#3A3F57;
    --text:#E7E8EE;
    --text-muted:#9498AC;
    --text-faint:#6A6E82;
    --accent:#8C9AE8;
    --accent-strong:#AAB4EE;
    --accent-soft:#262C4A;
    --on-accent:#141726;
    --success:#4FBE8B;
    --success-soft:#183226;
    --warning:#E0A63B;
    --warning-soft:#332A14;
    --danger:#E38078;
    --danger-soft:#3A1E1C;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow-md:0 8px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:inherit;font-size:inherit;}
  input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);}
  ::selection{background:var(--accent-soft);}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
  .num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;}
  .shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh;}
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:20px 14px;
    gap:4px;
  }
  .nav-backdrop{display:none;}
  .hamburger{
    display:none;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text-muted);cursor:pointer;flex:none;
  }
  .hamburger:hover{background:var(--surface-alt);}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px;}
  .brand-mark{
    width:30px;height:30px;border:1.6px solid var(--accent);border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-6deg);color:var(--accent);
    font-family:var(--font-mono);font-weight:700;font-size:12px;flex:none;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-size:15px;letter-spacing:-.01em;font-family:var(--font-mono);}
  .brand-text span{font-size:11px;color:var(--text-faint);}

  .nav-group{margin:10px 0 2px;padding:0 8px;font-size:11px;color:var(--text-faint);letter-spacing:.04em;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:var(--r-sm);
    color:var(--text-muted);cursor:pointer;border:1px solid transparent;
    background:none;text-align:left;width:100%;
  }
  .nav-item svg{flex:none;color:var(--text-faint);}
  .nav-item:hover{background:var(--surface-alt);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
  .nav-item.active svg{color:var(--accent-strong);}
  .nav-item .badge-count{
    margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
    min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }

  .sidebar-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;}
  .user-menu{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .user-chip{display:flex;align-items:center;gap:10px;padding:6px 8px;}
  button.user-chip:hover{background:var(--surface-alt);}
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;
  }
  .user-meta{display:flex;flex-direction:column;line-height:1.2;overflow:hidden;}
  .user-meta b{font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
  .user-meta span{font-size:11.5px;color:var(--text-faint);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;}
  .logout-btn{
    margin-top:8px;width:100%;display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:var(--r-sm);border:1px solid transparent;background:none;
    color:var(--text-faint);cursor:pointer;
  }
  .logout-btn:hover{background:var(--danger-soft);color:var(--danger);}

  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:60px;flex:none;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:var(--surface);
  }
  .topbar h1{font-size:17px;}
  .topbar .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:16px;color:var(--text-muted);font-size:13px;}
  .content{padding:28px;flex:1;min-width:0;}

  /* ---------- Notifications ---------- */
  .notif-wrap{position:relative;}
  .notif-btn{
    position:relative;background:none;border:none;color:var(--text-muted);cursor:pointer;
    padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  }
  .notif-btn:hover{background:var(--surface-alt);color:var(--text);}
  .notif-badge{
    position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
    min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;border:1.5px solid var(--surface);
  }
  .notif-backdrop{position:fixed;inset:0;z-index:159;background:transparent;}
  .notif-dropdown{
    position:absolute;top:calc(100% + 10px);right:0;width:360px;max-width:88vw;max-height:440px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
    box-shadow:var(--shadow-md);z-index:160;display:flex;flex-direction:column;overflow:hidden;
    animation:panel-in .16s ease-out;
  }
  .notif-dropdown-head{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid var(--border);flex:none;
  }
  .notif-dropdown-head b{font-size:14px;}
  .notif-mark-all{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:2px;}
  .notif-mark-all:hover{text-decoration:underline;}
  .notif-list{overflow-y:auto;flex:1;}
  .notif-item{
    display:flex;gap:10px;align-items:flex-start;padding:12px 16px;cursor:pointer;
    border-bottom:1px solid var(--border);text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none;
  }
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--surface-alt);}
  .notif-item.unread{background:var(--accent-soft);}
  .notif-item.unread:hover{background:var(--accent-soft);filter:brightness(0.97);}
  .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}
  .notif-dot.hidden{visibility:hidden;}
  .notif-body{flex:1;min-width:0;}
  .notif-body .notif-title{font-size:13px;font-weight:600;color:var(--text);}
  .notif-body .notif-msg{font-size:12.5px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
  .notif-body .notif-time{font-size:11px;color:var(--text-faint);margin-top:4px;}
  .notif-empty{padding:36px 16px;text-align:center;color:var(--text-faint);font-size:13px;}
  .content-narrow{max-width:760px;}

  /* ---------- Generic components ---------- */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);
  }
  .card-pad{padding:20px 22px;}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px;}
  .card-head h2{font-size:15px;}
  .card-head .hint{font-size:12.5px;color:var(--text-faint);}
  .stack{display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;gap:18px;}
  .grid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;}

  .stat{padding:18px 20px;}
  .stat .label{font-size:12.5px;color:var(--text-faint);letter-spacing:.02em;}
  .stat .value{font-size:28px;font-weight:700;margin-top:6px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .stat .value small{font-size:14px;color:var(--text-faint);font-weight:500;margin-left:2px;}
  .stat .delta{font-size:12px;margin-top:6px;color:var(--text-muted);}

  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:600;white-space:nowrap;
  }
  .pill.success{background:var(--success-soft);color:var(--success);}
  .pill.warning{background:var(--warning-soft);color:var(--warning);}
  .pill.danger{background:var(--danger-soft);color:var(--danger);}
  .pill.neutral{background:var(--surface-alt);color:var(--text-muted);}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:11.5px;color:var(--text-faint);font-weight:600;
    letter-spacing:.03em;padding:0 12px 8px;border-bottom:1px solid var(--border);
  }
  td{padding:12px 12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .list-row{
    display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none;}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field{display:flex;flex-direction:column;}
  .input,select.input,textarea.input{
    width:100%;border:1px solid var(--border-strong);background:var(--surface);
    border-radius:var(--r-sm);padding:9px 11px;color:var(--text);
  }
  textarea.input{resize:vertical;line-height:1.6;font-family:var(--font-sans);}
  .input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;}
  .field-row{display:flex;gap:12px;}
  .field-row > *{flex:1;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .helptext{font-size:12px;color:var(--text-faint);margin-top:5px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:13.5px;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;
  }
  .btn:hover{background:var(--surface-alt);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn.ghost{border-color:transparent;background:none;}
  .btn.ghost:hover{background:var(--surface-alt);}
  .btn.danger-o{border-color:var(--danger);color:var(--danger);background:none;}
  .btn.danger-o:hover{background:var(--danger-soft);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;}

  .badge-auto{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    color:var(--accent-strong);background:var(--accent-soft);padding:3px 9px;border-radius:999px;
  }

  .divider{height:1px;background:var(--border);border:none;margin:0;}
  .empty{padding:30px 10px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(600px 300px at 15% 8%, var(--accent-soft), transparent 60%),
      var(--bg);
    padding:24px;
  }
  .login-card{width:100%;max-width:380px;padding:32px 30px;}
  .login-brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:26px;}
  .login-brand .brand-mark{width:42px;height:42px;font-size:15px;border-radius:9px;}
  .login-brand h1{font-size:19px;}
  .login-brand p{font-size:13px;color:var(--text-faint);margin-top:4px;}
  .login-demo{
    margin-top:18px;font-size:12px;color:var(--text-faint);
    background:var(--surface-alt);border-radius:var(--r-sm);padding:10px 12px;
  }
  .login-demo b{color:var(--text-muted);}

  /* ---------- Toast ---------- */
  #toast-region{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{
    background:var(--text);color:var(--bg);padding:11px 16px;border-radius:var(--r-sm);
    font-size:13px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;
    animation:toast-in .18s ease-out;
  }
  @keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Approval detail panel ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,11,18,.42);display:flex;justify-content:flex-end;z-index:150;
  }
  .panel{
    width:420px;max-width:92vw;background:var(--surface);height:100%;
    box-shadow:var(--shadow-md);padding:24px;overflow-y:auto;
    animation:panel-in .18s ease-out;
    display:flex;flex-direction:column;gap:18px;
  }
  @keyframes panel-in{from{transform:translateX(16px);opacity:.5;}to{transform:translateX(0);opacity:1;}}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .icon-btn{
    background:none;border:none;color:var(--text-faint);cursor:pointer;padding:4px;border-radius:6px;
  }
  .icon-btn:hover{background:var(--surface-alt);color:var(--text);}
  .kv{display:flex;flex-direction:column;gap:10px;}
  .kv-row{display:flex;justify-content:space-between;gap:14px;font-size:13px;}
  .kv-row .k{color:var(--text-faint);}
  .kv-row .v{font-weight:600;text-align:right;}
  .body-box{
    background:var(--surface-alt);border-radius:var(--r-sm);padding:14px;font-size:13px;
    white-space:pre-wrap;line-height:1.6;color:var(--text-muted);
  }

  .stamp{
    display:inline-flex;align-items:center;gap:6px;border:2px solid var(--success);color:var(--success);
    font-weight:700;font-size:12px;letter-spacing:.04em;padding:5px 12px;border-radius:8px;
    transform:rotate(-4deg);animation:stamp-in .22s cubic-bezier(.2,1.4,.4,1);
  }
  .stamp.reject{border-color:var(--danger);color:var(--danger);}
  @keyframes stamp-in{from{transform:rotate(-4deg) scale(1.6);opacity:0;}to{transform:rotate(-4deg) scale(1);opacity:1;}}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .tab{
    padding:9px 4px;margin-right:18px;font-size:13.5px;color:var(--text-faint);
    border-bottom:2px solid transparent;cursor:pointer;font-weight:600;background:none;border-top:none;border-left:none;border-right:none;
  }
  .tab.active{color:var(--accent-strong);border-bottom-color:var(--accent);}

  /* ---------- Calendar ---------- */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .cal-legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--text-muted);}
  .cal-legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
  .cal-weekhead{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm) var(--r-sm) 0 0;overflow:hidden;}
  .cal-weekhead div{background:var(--surface-alt);padding:8px 0;text-align:center;font-size:11.5px;font-weight:700;color:var(--text-faint);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r-sm) var(--r-sm);overflow:hidden;}
  .cal-cell{background:var(--surface);min-height:98px;padding:6px;display:flex;flex-direction:column;gap:3px;}
  .cal-cell.out{background:var(--surface-alt);}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--text-muted);}
  .cal-cell.out .cal-daynum{color:var(--text-faint);}
  .cal-cell.today .cal-daynum{color:var(--accent-strong);}
  .cal-chip{
    display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    font-size:11px;padding:2px 6px;border-radius:5px;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cal-chip.leave{background:var(--success-soft);color:var(--success);}
  .cal-chip.event{background:var(--accent-soft);color:var(--accent-strong);}
  .cal-more{font-size:11px;color:var(--text-faint);background:none;border:none;cursor:pointer;text-align:left;padding:2px 6px;}
  .cal-more:hover{text-decoration:underline;}

  /* ---------- Modal (centered overlay) ---------- */
  .overlay.center{justify-content:center;align-items:center;}
  .modal{
    width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--surface);
    border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:24px;
    display:flex;flex-direction:column;gap:16px;
    animation:panel-in .18s ease-out;
  }

  .upload-box{
    border:1.5px dashed var(--border-strong);border-radius:var(--r-sm);padding:14px 16px;
    display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:13px;
    background:var(--surface-alt);
  }
  .upload-box.filled{border-style:solid;border-color:var(--accent);color:var(--text);background:var(--accent-soft);}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);}
  .checkbox-row input{width:16px;height:16px;accent-color:var(--accent);}
  optgroup{font-weight:700;color:var(--text-muted);}

  /* ---------- Date field (텍스트 자동변환 + 달력 선택) ---------- */
  .date-group{position:relative;display:flex;align-items:center;}
  .date-group input.input{flex:1;padding-right:34px;font-variant-numeric:tabular-nums;}
  .date-icon-btn{
    position:absolute;right:4px;background:none;border:none;color:var(--text-faint);
    cursor:pointer;padding:5px;border-radius:5px;display:flex;
  }

  function businessDaysBetween(startStr, endStr){
    var start=new Date(startStr+'T00:00:00'), end=new Date(endStr+'T00:00:00');
    if(isNaN(start)||isNaN(end)||end<start) return 0;
    var count=0, d=new Date(start);
    while(d<=end){
      var wd=d.getDay();
      if(wd!==0 && wd!==6) count++;
      d.setDate(d.getDate()+1);
    }
    return count;
  }

  function attachPhoneFormat(inputEl, obj, key){

  function calendarDaysBetween(startStr, endStr){

  // 날짜 입력: 숫자만 입력하면 YYYY-MM-DD로 자동 하이픈 변환(연도 4자리 고정) + 달력 아이콘으로 네이티브 선택
  // 반환: {el, getValue, setValue, setMin}
  function makeDateField(value, onChange, opts){
    opts=opts||{};
    var wrap=el('<div class="date-group"></div>');
    var text=el('<input class="input" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" maxlength="10" value="'+escapeHtml(value||'')+'" />');
    var iconBtn=el('<button type="button" class="date-icon-btn" aria-label="달력에서 선택">'+ICON.calendar+'</button>');
    var hidden=el('<input type="date" class="date-hidden" tabindex="-1" aria-hidden="true" />');
    if(opts.min) hidden.min=opts.min;
    if(opts.max) hidden.max=opts.max;

    function formatDigits(raw){
      var d=raw.replace(/\D/g,'').slice(0,8); // YYYYMMDD, 연도 4자리 고정
      if(d.length<=4) return d;
      if(d.length<=6) return d.slice(0,4)+'-'+d.slice(4);
      return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);
    }
    text.addEventListener('input', function(){
      var formatted=formatDigits(text.value);
      text.value=formatted;
      onChange(formatted);
    });
    iconBtn.addEventListener('click', function(){
      if(/^\d{4}-\d{2}-\d{2}$/.test(text.value)) hidden.value=text.value;
      if(hidden.showPicker){ try{ hidden.showPicker(); }catch(e){ hidden.focus(); } }
      else { hidden.focus(); hidden.click(); }
    });
    hidden.addEventListener('change', function(){
      text.value=hidden.value;
      onChange(hidden.value);
    });

    wrap.appendChild(text);
    wrap.appendChild(iconBtn);
    wrap.appendChild(hidden);
    return {
      el:wrap,
      getValue:function(){ return text.value; },
      setValue:function(v){ text.value=v||''; hidden.value=v||''; },
      setMin:function(v){ hidden.min=v||''; }
    };
  }

  function prevBusinessDayKey(dateKey){
    var d=new Date(dateKey+'T00:00:00');
    do{ d.setDate(d.getDate()-1); } while(d.getDay()===0 || d.getDay()===6);
    return toLocalKey(d);
  }

  /* ============ Attendance (출퇴근) helpers ============ */
  function isAdminUser(){
    var u=USERS.find(function(x){return x.name===ME.name;});
    return !!u && u.role==='ADMIN';
  }
  function hashSeed(str){
    var h=0;
    for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; }
    return h;
  }
  function minToHHMM(mins){ return pad2(Math.floor(mins/60))+':'+pad2(mins%60); }
  function daysInMonth(ym){
    var parts=ym.split('-'), y=Number(parts[0]), m=Number(parts[1]);
    var last=new Date(y,m,0).getDate();
    var arr=[];
    for(var d=1; d<=last; d++){ arr.push(y+'-'+pad2(m)+'-'+pad2(d)); }
    return arr;
  }
  // 특정 직원의 특정 날짜 근태 상태를 계산(본인은 실제 기록, 그 외 인원은 데모용 결정적 가상 기록)
  function getAttendanceForDay(userName, dateKey){
    var leave=TEAM_LEAVES.find(function(l){ return l.name===userName && dateInRange(dateKey,l.start,l.end); });
    if(leave){
      var cfg=LEAVE_TYPES.find(function(t){return t.name===leave.type;});
      return { kind:'LEAVE', leaveType:leave.type, unpaid: !!(cfg && cfg.payType==='UNPAID') };
    }
    var d=new Date(dateKey+'T00:00:00');
    var isWeekend = d.getDay()===0 || d.getDay()===6;
    if(isWeekend) return { kind:'WEEKEND' };
    if(dateKey>TODAY) return { kind:'FUTURE' };
    if(userName===ME.name && dateKey===TODAY){
      var rec=attendanceRecords[TODAY];
      return (rec && rec.checkIn) ? { kind:'RECORD', checkIn:rec.checkIn, checkOut:rec.checkOut||null, auto:!!rec.auto } : { kind:'NONE' };
    }
    if(userName===ME.name && attendanceRecords[dateKey] && attendanceRecords[dateKey].checkIn){
      var r=attendanceRecords[dateKey];
      return { kind:'RECORD', checkIn:r.checkIn, checkOut:r.checkOut||null, auto:!!r.auto };
    }
    // 데모용 결정적 가상 출퇴근 시각(과거 평일)
    var inMin = 520 + (hashSeed(userName+dateKey+'in')%40);   // 08:40~09:19
    var outMin = 1080 + (hashSeed(userName+dateKey+'out')%90); // 18:00~19:29
    return { kind:'RECORD', checkIn:minToHHMM(inMin), checkOut:minToHHMM(outMin) };
  }
  function monthSummary(userName, ym){
    var out={present:0, leave:0, unpaidLeave:0, none:0};
    daysInMonth(ym).forEach(function(k){
      var a=getAttendanceForDay(userName, k);
      if(a.kind==='RECORD') out.present++;
      else if(a.kind==='LEAVE'){ out.leave++; if(a.unpaid) out.unpaidLeave++; }
      else if(a.kind==='NONE') out.none++;
    });
    return out;
  }

  // 별도 퇴근 체크 없이 18:30이 지나면 당일 퇴근시간을 18:00으로 자동 저장
  // (단, 당일 승인된 초과근무 신청이 있으면 계속 근무 중인 것으로 보고 자동 마감하지 않음)
  function applyAutoCheckout(){
    var rec=attendanceRecords[TODAY];
    if(rec && rec.checkIn && !rec.checkOut && NOW_TIME>='18:30' && !hasApprovedOvertime(TODAY)){

  }

  // 시작시각(정시)에서 사용시간(시간)만큼 근무시간을 소진했을 때의 종료시각을 계산(점심시간 자동 스킵)
  function computeEndInfo(startH, durationHours){
    var lunchS=parseInt(COMPANY.lunchStart,10), lunchE=parseInt(COMPANY.lunchEnd,10);
    var t=startH, remaining=durationHours, lunchSkipped=false, guard=0;
    while(remaining>0 && guard<48){
      guard++;
      if(t>=lunchS && t<lunchE){ t=lunchE; lunchSkipped=true; continue; }
      t+=1; remaining-=1;
    }
    return { endHour:t, lunchSkipped:lunchSkipped };
  }

  // 시작시각 기준으로, 종료시각이 회사 등록 퇴근시간(COMPANY.workEndTime) 이내에 드는 사용시간 옵션만 반환
  function validDurationsFor(startH){
    var opts=[];
    var unit=COMPANY.hourlyLeaveUnitHours, cap=COMPANY.hourlyLeaveMaxHours;
    var maxHour=parseInt(COMPANY.workEndTime,10);
    for(var d=unit; d<=cap; d+=unit){
      var info=computeEndInfo(startH, d);
      if(info.endHour<=maxHour) opts.push(d);
    }
    return opts;
  }

  function renderLeaveScreen(){
    var wrap=el('<div class="grid-2"></div>');

    // 수정 모드: 대기중이 아니게 되었으면(경쟁 상황) 자동으로 신규 신청 모드로 복귀
    var editingEntry = state.editingLeaveId ? leaveHistory.find(function(h){return h.id===state.editingLeaveId;}) : null;
    if(state.editingLeaveId && (!editingEntry || editingEntry.status!=='대기')){
      toast('이미 처리되어 수정할 수 없습니다. 최신 상태로 갱신합니다.');
      state.editingLeaveId=null;
      editingEntry=null;
    }

    var formCard=el('<div class="card card-pad"><div class="card-head"><h2>'+(editingEntry?'연차 신청 수정':'연차 신청')+'</h2></div></div>');
    if(editingEntry){
      var cancelEditBtn=el('<button class="btn ghost" type="button" style="margin:-8px 0 12px;padding:5px 10px;font-size:12.5px;">← 수정 취소하고 새 신청으로</button>');
      cancelEditBtn.addEventListener('click', function(){ state.editingLeaveId=null; render(); });
      formCard.appendChild(cancelEditBtn);
    }
    var form=el('<form class="stack" style="gap:16px;"></form>');

    var typeField=el('<div class="field"><label for="lv-type">신청 유형</label></div>');
    var typeSel=el('<select class="input" id="lv-type"></select>');
    ['ANNUAL_DEDUCT','SPECIAL','OFFICIAL'].forEach(function(cat){
      var grp=el('<optgroup label="'+CATEGORY_LABEL[cat]+'"></optgroup>');
      LEAVE_TYPES.filter(function(t){return t.category===cat;}).forEach(function(t){
        var payTag = t.payType==='UNPAID' ? ' · 무급' : '';
        grp.appendChild(el('<option value="'+t.code+'">'+t.name+payTag+'</option>'));
      });
      typeSel.appendChild(grp);
    });
    if(editingEntry) typeSel.value=editingEntry.typeCode;
    typeField.appendChild(typeSel);
    form.appendChild(typeField);

    // --- 연차(일) 등 날짜범위 입력 ---
    var dayRow=el('<div class="field-row"></div>');
    var startField=el('<div class="field"><label>시작일</label></div>');
    var endField=el('<div class="field"><label>종료일</label></div>');
    var startDG=makeDateField(editingEntry && editingEntry.startDate ? editingEntry.startDate : '2026-08-20', function(){ updatePreview(); });
    var endDG=makeDateField(editingEntry && editingEntry.endDate ? editingEntry.endDate : '2026-08-20', function(){ updatePreview(); });
    startField.appendChild(startDG.el);
    endField.appendChild(endDG.el);
    dayRow.appendChild(startField); dayRow.appendChild(endField);
    form.appendChild(dayRow);

    // --- 연차(시간) 날짜+시작시간+사용시간 입력 ---
    var hourRow=el('<div class="field-row" style="display:none;"></div>');
    var hDateField=el('<div class="field"><label>날짜</label></div>');
    var hDateDG=makeDateField(editingEntry && editingEntry.hourDate ? editingEntry.hourDate : '2026-08-20', function(){ updatePreview(); });
    hDateField.appendChild(hDateDG.el);
    var hStartField=el('<div class="field"><label>시작시간</label></div>');
    var hStartSel=el('<select class="input"></select>');
    workHourOptions().forEach(function(h){ hStartSel.appendChild(el('<option value="'+h+'">'+h+'</option>')); });
    hStartSel.value = editingEntry && editingEntry.hourStart ? editingEntry.hourStart : COMPANY.workStartTime;
    var hDurationField=el('<div class="field"><label>사용시간</label></div>');
    var hDurationSel=el('<select class="input"></select>');

    function refreshDurationOptions(){
      var startH=parseInt(hStartSel.value,10);
      var prevVal=hDurationSel.value;
      var opts=validDurationsFor(startH);
      hDurationSel.innerHTML='';
      if(opts.length===0){
        hDurationSel.appendChild(el('<option value="">선택 가능한 시간 없음</option>'));
        hDurationSel.disabled=true;
      } else {
        hDurationSel.disabled=false;
        opts.forEach(function(d){ hDurationSel.appendChild(el('<option value="'+d+'">'+d+'시간</option>')); });
        // 이전 선택값이 여전히 유효하면 유지, 아니면 첫 옵션 선택
        hDurationSel.value = opts.indexOf(Number(prevVal))>=0 ? prevVal : String(opts[0]);
      }
    }
    hStartSel.addEventListener('change', function(){ refreshDurationOptions(); updatePreview(); });
    hDurationSel.addEventListener('change', updatePreview);
    hStartField.appendChild(hStartSel);
    hDurationField.appendChild(hDurationSel);
    hourRow.appendChild(hDateField); hourRow.appendChild(hStartField); hourRow.appendChild(hDurationField);
    form.appendChild(hourRow);
    refreshDurationOptions();
    if(editingEntry && editingEntry.hourDuration && !hDurationSel.disabled){
      var editDurStr=String(editingEntry.hourDuration);
      if(Array.from(hDurationSel.options).some(function(o){return o.value===editDurStr;})){ hDurationSel.value=editDurStr; }
    }

    var hourHelp=el('<div class="helptext" style="display:none;">회사 근무시간('+COMPANY.workStartTime+'~'+COMPANY.workEndTime+') 안에서, 시작시간을 기준으로 신청 가능한 사용시간만 표시됩니다('+COMPANY.hourlyLeaveUnitHours+'시간 단위, 최대 '+COMPANY.hourlyLeaveMaxHours+'시간). 점심시간('+COMPANY.lunchStart+'~'+COMPANY.lunchEnd+')은 자동 제외됩니다.</div>');
    form.appendChild(hourHelp);

    var reasonField=el('<div class="field"><label for="lv-reason">사유</label><textarea class="input" id="lv-reason" rows="3" placeholder="예: 개인 사유">'+escapeHtml(editingEntry?editingEntry.reason||'':'')+'</textarea></div>');
    form.appendChild(reasonField);

    var preview=el('<div class="card" id="lv-preview" style="background:var(--surface-alt);border:1px dashed var(--border-strong);"><div style="padding:14px 16px;" class="kv"></div></div>');
    var previewKv=preview.querySelector('.kv');
    form.appendChild(preview);

    var noDeductNote=el('<div class="helptext" id="lv-nodeduct" style="display:none;">이 유형은 연차에서 차감되지 않습니다.</div>');
    form.appendChild(noDeductNote);

    var unpaidNote=el('<div class="pill danger" id="lv-unpaid" style="display:none;align-self:flex-start;">무급 휴가입니다 — 해당일 급여에서 제외됩니다</div>');
    form.appendChild(unpaidNote);

    var attachField=el('<div class="field" id="lv-attach-field" style="display:none;">'+
      '<label>증빙파일 <span id="lv-attach-required" style="font-weight:400;color:var(--danger);">(필수)</span></label>'+
      '<div class="upload-box" id="lv-upload-box">'+ICON.upload+'<span id="lv-upload-text">예비군훈련확인서, 진단서, 청첩장 등 증빙파일을 첨부하세요</span></div>'+
      '<input type="file" id="lv-file-input" style="display:none;" />'+
    '</div>');
    form.appendChild(attachField);

    var errBox=el('<div class="helptext" style="color:var(--danger);display:none;" id="lv-error"></div>');
    form.appendChild(errBox);

    form.appendChild(el('<div class="btn-row"><button class="btn primary" type="submit">'+(editingEntry?'수정 저장':'결재 상신')+'</button></div>'));

    var attached=false;
    var fileInput=attachField.querySelector('#lv-file-input');
    var uploadBox=attachField.querySelector('#lv-upload-box');
    uploadBox.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(){
      attached = fileInput.files.length>0;
      uploadBox.classList.toggle('filled', attached);
      attachField.querySelector('#lv-upload-text').textContent = attached ? ('첨부됨: '+fileInput.files[0].name) : '예비군훈련확인서, 진단서, 청첩장 등 증빙파일을 첨부하세요';
      form.querySelector('button[type=submit]').disabled = computeValidity();
    });

    function currentType(){ return LEAVE_TYPES.find(function(t){return t.code===typeSel.value;}); }

    var lastRem = 0;
    var lastHourInfo = null;
    function computeValidity(){
      var type=currentType();
      if(type.inputMode==='HOUR_RANGE') return !(lastHourInfo && lastHourInfo.valid) || lastRem<0;
      if(type.category==='ANNUAL_DEDUCT') return lastRem<0;
      return type.requireAttachment && !attached;
    }

    // 시작~종료시간에서 점심시간을 자동 제외하고, 단위/상한을 검증
    function calcHourInfo(startT, durationHours){
      var startH=parseInt(startT,10);
      if(!durationHours || isNaN(durationHours)){
        return { usedHours:0, endHour:startH, lunchSkipped:false, valid:false, reason:'시작시간을 기준으로 신청 가능한 사용시간이 없습니다. 시작시간을 조정하세요.', days:0 };
      }
      var endInfo=computeEndInfo(startH, durationHours);
      return {
        usedHours:durationHours, endHour:endInfo.endHour, lunchSkipped:endInfo.lunchSkipped,
        valid:true, reason:'', days: durationHours/COMPANY.standardWorkHoursPerDay
      };
    }

    function updatePreview(){
      var type=currentType();
      var isHour = type.inputMode==='HOUR_RANGE';
      var isDayRange = type.inputMode==='DAY_RANGE';
      var isDeduct = type.category==='ANNUAL_DEDUCT';

      dayRow.style.display = isDayRange ? '' : 'none';
      hourRow.style.display = isHour ? '' : 'none';
      hourHelp.style.display = isHour ? '' : 'none';
      preview.style.display = isDeduct ? '' : 'none';
      noDeductNote.style.display = isDeduct ? 'none' : '';
      unpaidNote.style.display = type.payType==='UNPAID' ? 'inline-flex' : 'none';
      attachField.style.display = isDeduct ? 'none' : '';
      attachField.querySelector('#lv-attach-required').style.display = type.requireAttachment ? '' : 'none';
      errBox.style.display='none';

      var s,e2,days;

      if(isHour){
        var info=calcHourInfo(hStartSel.value, Number(hDurationSel.value));
        lastHourInfo=info;
        s=hDateDG.getValue(); e2=s;
        days = info.valid ? info.days : 0;
        lastRem = remaining()-days;
        var lunchNote = info.lunchSkipped ? ' (점심시간 자동 제외)' : '';
        previewKv.innerHTML = !info.valid ? '' :
          '<div class="kv-row"><span class="k">종료 예정 시간</span><span class="v num">'+pad2(info.endHour)+':00'+lunchNote+'</span></div>'+
          '<div class="kv-row" style="margin-top:8px;"><span class="k">환산 차감일수</span><span class="v num">'+fmtDay(days)+'</span></div>'+
          '<div class="kv-row" style="margin-top:8px;"><span class="k">신청 후 잔여연차</span><span class="v num" style="'+(lastRem<0?'color:var(--danger);':'')+'">'+fmtDay(lastRem)+'</span></div>';
        if(!info.valid){ errBox.textContent=info.reason; errBox.style.display=''; }
        else if(lastRem<0){ errBox.textContent='잔여연차가 부족합니다.'; errBox.style.display=''; }
      } else if(isDayRange){
        endDG.setMin(startDG.getValue());
        if(endDG.getValue() && startDG.getValue() && endDG.getValue()<startDG.getValue()){
          endDG.setValue(startDG.getValue());
        }
        s=startDG.getValue(); e2=endDG.getValue();
        days=businessDaysBetween(s,e2);
        if(isDeduct){
          lastRem=remaining()-days;
          previewKv.innerHTML =
            '<div class="kv-row"><span class="k">차감 일수</span><span class="v num">'+fmtDay(days)+'</span></div>'+
            '<div class="kv-row" style="margin-top:8px;"><span class="k">신청 후 잔여연차</span><span class="v num" style="'+(lastRem<0?'color:var(--danger);':'')+'">'+fmtDay(lastRem)+'</span></div>';
          if(lastRem<0){ errBox.textContent='잔여연차가 부족합니다.'; errBox.style.display=''; }
        } else {
          lastRem=0;
        }
      }

      form.querySelector('button[type=submit]').disabled = computeValidity() || days<=0;
      return { type:type, s:s, e:e2, days:days, isDeduct:isDeduct, isHour:isHour };
    }
    typeSel.addEventListener('change', updatePreview);

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var v = updatePreview();
      if(v.days<=0) return;
      if(v.isHour && (!lastHourInfo || !lastHourInfo.valid)) return;
      if(!v.isDeduct && v.type.requireAttachment && !attached){ toast('증빙파일을 첨부해야 상신할 수 있습니다.'); return; }
      var periodLabel;
      if(v.isHour){
        periodLabel = v.s+' '+hStartSel.value+'~'+pad2(lastHourInfo.endHour)+':00 ('+lastHourInfo.usedHours+'시간'+(lastHourInfo.lunchSkipped?', 점심 제외':'')+')';
      } else {
        periodLabel = v.s===v.e ? v.s : (v.s+' ~ '+v.e);
      }
      var reasonVal=reasonField.querySelector('textarea').value.trim();
      var structured = v.isHour
        ? { startDate:null, endDate:null, hourDate:v.s, hourStart:hStartSel.value, hourDuration:lastHourInfo.usedHours }
        : { startDate:v.s, endDate:v.e, hourDate:null, hourStart:null, hourDuration:null };

      if(state.editingLeaveId){
        // ---- 수정 저장: 무결성 재검증(경쟁 상황 가드) ----
        var live=leaveHistory.find(function(h){return h.id===state.editingLeaveId;});
        if(!live || live.status!=='대기' || live.version!==state.editingLeaveVersion){
          toast('이미 처리되어 수정할 수 없습니다. 최신 상태로 갱신합니다.');
          state.editingLeaveId=null; state.editingLeaveVersion=null;
          render();
          return;
        }
        var wasDeduct = live.category==='ANNUAL_DEDUCT';
        var tentativeRemaining = remaining() + (wasDeduct ? live.days : 0);
        if(v.isDeduct && tentativeRemaining - v.days < 0){
          toast('잔여연차가 부족합니다.');
          return;
        }
        if(wasDeduct) balance.used -= live.days;
        if(v.isDeduct) balance.used += v.days;
        live.type=v.type.name; live.typeCode=v.type.code; live.category=v.type.category; live.payType=v.type.payType;
        live.period=periodLabel; live.days=v.days; live.reason=reasonVal;
        live.startDate=structured.startDate; live.endDate=structured.endDate;
        live.hourDate=structured.hourDate; live.hourStart=structured.hourStart; live.hourDuration=structured.hourDuration;
        live.version+=1; live.editedAt=TODAY;
        state.editingLeaveId=null; state.editingLeaveVersion=null;
        toast('신청 내용이 수정되었습니다.');
        render();
        return;
      }

      if(v.isDeduct && remaining()-v.days<0) return;
      var newEntry = Object.assign({ id:nextLeaveId++, status:'대기', approver:'정민아 팀장', version:1, editedAt:null, reason:reasonVal,
        type:v.type.name, typeCode:v.type.code, category:v.type.category, payType:v.type.payType, period:periodLabel, days:v.days }, structured);
      leaveHistory.unshift(newEntry);
      if(v.isDeduct) balance.used += v.days;
      toast('연차 신청이 상신되었습니다.');
      render();
    });

    formCard.appendChild(form);
    setTimeout(updatePreview, 0);

    var sideCard=el('<div class="card card-pad"><div class="card-head"><h2>신청 내역</h2><span class="hint">잔여 '+remaining()+'일 / 발생 '+balance.granted+'일</span></div></div>');
    var wrapTable=el('<div class="table-wrap"></div>');
    var table=el('<table><thead><tr><th>유형</th><th>기간</th><th>일수</th><th>상태</th><th></th></tr></thead><tbody></tbody></table>');
    var tbody=table.querySelector('tbody');
    if(leaveHistory.length===0){
      tbody.appendChild(el('<tr><td colspan="5"><div class="empty">신청 내역이 없습니다.</div></td></tr>'));
    }
    leaveHistory.forEach(function(h){
      var unpaidTag = h.payType==='UNPAID' ? ' <span class="pill danger" style="padding:1px 7px;">무급</span>' : '';
      var editedTag = h.editedAt ? ' <span class="pill neutral" style="padding:1px 7px;">수정됨</span>' : '';
      var tr=el('<tr><td>'+h.type+unpaidTag+editedTag+'</td><td class="num">'+h.period+'</td><td class="num">'+fmtDay(h.days)+'</td><td>'+statusPill(h.status)+'</td><td style="text-align:right;white-space:nowrap;"></td></tr>');
      var actionTd=tr.lastElementChild;
      if(h.status==='대기'){
        var editBtn=el('<button class="btn ghost" type="button" style="padding:4px 8px;font-size:12px;">수정</button>');
        editBtn.addEventListener('click', function(){
          if(h.status!=='대기'){ toast('이미 처리되어 수정할 수 없습니다.'); render(); return; }
          state.editingLeaveId=h.id; state.editingLeaveVersion=h.version; render();
        });
        var cancelBtn=el('<button class="btn ghost" type="button" style="padding:4px 8px;font-size:12px;color:var(--danger);">취소</button>');
        cancelBtn.addEventListener('click', function(){
          if(h.status!=='대기'){ toast('이미 처리되어 취소할 수 없습니다.'); render(); return; }
          if(!confirm('이 연차 신청을 취소하시겠습니까?')) return;
          if(h.category==='ANNUAL_DEDUCT') balance.used -= h.days;
          h.status='회수'; h.version+=1;
          toast('신청이 취소되었습니다.');
          render();
        });
        actionTd.appendChild(editBtn);
        actionTd.appendChild(cancelBtn);
        var demoBtn=el('<button class="btn ghost" type="button" style="padding:4px 8px;font-size:11px;color:var(--text-faint);" title="결재자가 지금 막 처리했다고 가정(무결성 가드 데모)">⚡데모</button>');
        demoBtn.addEventListener('click', function(){
          h.status='승인'; h.version+=1;
          pushNotification('APPROVAL_RESULT', h.type+' 승인', h.period+' '+h.type+' 신청이 승인되었습니다.', {
            createdAt:TODAY, action:function(){ state.screen='leave'; }
          });
          toast('데모: 결재자가 방금 이 건을 승인 처리했습니다 (화면은 아직 갱신 전 — 위 "수정"/"취소"를 눌러보세요).');
        });
        actionTd.appendChild(demoBtn);
      }
      tbody.appendChild(tr);
    });
    wrapTable.appendChild(table);
    sideCard.appendChild(wrapTable);

    wrap.appendChild(formCard);
    wrap.appendChild(sideCard);
    return wrap;
  }

  /* ============ Overtime request screen (초과근무 신청) ============ */
  function renderOvertimeScreen(){
    var wrap=el('<div class="grid-2"></div>');

    var formCard=el('<div class="card card-pad"><div class="card-head"><h2>초과근무 신청</h2></div></div>');
    formCard.appendChild(el('<div class="helptext" style="margin:-6px 0 14px;">반드시 결재 승인이 있어야 하며, 승인된 신청 건이 있는 날에만 19:00 이후 퇴근 체크가 가능합니다.</div>'));

    var form=el('<form class="stack" style="gap:16px;"></form>');

    var dateField=el('<div class="field"><label>날짜</label></div>');
    var dateDG=makeDateField(TODAY, function(){});
    dateField.appendChild(dateDG.el);
    form.appendChild(dateField);

    var endField=el('<div class="field"><label for="ot-end">예상 퇴근시간</label><input class="input" id="ot-end" type="time" value="21:00" /></div>');
    form.appendChild(endField);
    var endWarn=el('<div class="helptext" id="ot-end-warn" style="display:none;color:var(--danger);">19:00 이후 시간을 입력하세요.</div>');
    form.appendChild(endWarn);

    var workField=el('<div class="field"><label for="ot-work">업무내용(상세)</label><textarea class="input" id="ot-work" rows="3" placeholder="예: 프로모션 소재 최종 검수 및 발행 준비"></textarea></div>');
    form.appendChild(workField);

    var reasonField=el('<div class="field"><label for="ot-reason">사유</label><textarea class="input" id="ot-reason" rows="2" placeholder="예: 출시 일정 임박으로 야간 작업 필요"></textarea></div>');
    form.appendChild(reasonField);

    form.appendChild(el('<div class="btn-row"><button class="btn primary" type="submit">결재 상신</button></div>'));

    var endInput=endField.querySelector('input');
    function validateEnd(){
      var invalid = endInput.value && endInput.value<='19:00';
      endWarn.style.display = invalid ? '' : 'none';

  function statusPill(status){
    var map={ '대기':'warning', '승인':'success', '반려':'danger', '회수':'neutral', 'PENDING':'warning', 'APPROVED':'success', 'REJECTED':'danger', 'RECALLED':'neutral' };
    var labelMap={ 'PENDING':'대기', 'APPROVED':'승인', 'REJECTED':'반려', 'RECALLED':'회수' };
    var cls = map[status] || 'neutral';
    var label = labelMap[status] || status;
    return '<span class="pill '+cls+'">'+label+'</span>';
  }

    businessTrips.forEach(function(t){
      var periodText = t.tripType==='관내' ? (t.startDate+' '+t.startTime+'~'+t.endTime) : (t.startDate+' ~ '+t.endDate);
      var tr=el('<tr><td><span class="pill neutral">'+t.tripType+'</span></td><td class="num">'+periodText+'</td><td>'+escapeHtml(t.destination)+'</td><td>'+statusPill(t.status)+'</td><td style="text-align:right;"></td></tr>');
      if(t.status==='대기'){
        var cancelBtn=el('<button class="btn ghost" type="button" style="padding:4px 8px;font-size:12px;color:var(--danger);">취소</button>');
        cancelBtn.addEventListener('click', function(){
          if(t.status!=='대기'){ toast('이미 처리되어 취소할 수 없습니다.'); render(); return; }
          if(!confirm('이 출장신청을 취소하시겠습니까?')) return;
          t.status='회수'; t.version+=1;
          toast('출장신청이 취소되었습니다.');
          render();
        });
        tr.lastElementChild.appendChild(cancelBtn);
      }
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    sideCard.appendChild(tableWrap);

    wrap.appendChild(formCard);
    wrap.appendChild(sideCard);
    return wrap;
  }

  /* ============ 출장결과보고 (시외출장 완료 건 대상) ============ */
  function eligibleTripsForReport(){
    return businessTrips.filter(function(t){ return t.tripType==='시외' && t.status==='승인' && t.endDate<=TODAY; });
  }

  /* ============ 알림 초기 데이터 구성 ============
     1) 결재 요청 도착(승인자에게) 2) 결재 처리 결과(신청자에게) 3) 공지사항 등록 4) 기한 임박/초과 */
  function seedNotifications(){
    approvalQueue.filter(function(a){ return a.status==='PENDING'; })
      .slice().sort(function(a,b){ return a.submittedAt<b.submittedAt?1:-1; })
      .forEach(function(a){
        pushNotification('APPROVAL_REQUEST', TYPE_LABEL[a.type]+' 결재 요청', a.requester+' · '+a.dept+' — '+a.summary, {
          createdAt:a.submittedAt,
          action:function(){ state.screen='approvals'; state.detailApprovalId=a.id; }
        });
      });

    pushNotification('APPROVAL_RESULT', '일일업무보고 승인', '08/11 일일업무보고가 승인되었습니다.', {
      createdAt:'2026-08-11',
      action:function(){ state.screen='daily'; state.detailReport={kind:'DAILY', key:'2026-08-11'}; }
    });
    pushNotification('APPROVAL_RESULT', '병가 승인', '2026-08-06 병가 신청이 승인되었습니다.', {
      createdAt:'2026-08-06',
      action:function(){ state.screen='leave'; }
    });
    pushNotification('APPROVAL_RESULT', '초과근무 승인', '08/13 초과근무 신청이 승인되었습니다.', {
      createdAt:'2026-08-13',
      action:function(){ state.screen='overtime'; }
    });

    var latestNotice = BOARD_POSTS.filter(function(p){ return p.isNotice; }).sort(function(a,b){ return a.createdAt<b.createdAt?1:-1; })[0];
    if(latestNotice){
      pushNotification('NOTICE', '새 공지사항', latestNotice.title, {
        createdAt:latestNotice.createdAt,
        action:function(){ state.screen='board'; state.boardMode='view'; state.boardSelectedId=latestNotice.id; }
      });
    }

    businessTrips.filter(function(t){ return t.tripType==='시외' && t.status==='승인' && t.endDate<=TODAY && !t.report; })
      .forEach(function(t){
        var due=tripReportDueInfo(t);
        if(due.overdue || due.daysLeft<=1){
          pushNotification('DEADLINE',
            due.overdue ? '출장결과보고 기한 초과' : '출장결과보고 기한 임박',
            t.destination+' 출장결과보고 제출기한 '+due.dueKey+(due.overdue?' (기한 초과)':' (D-'+due.daysLeft+')'),
            { createdAt:TODAY, action:function(){ state.screen='trip-report'; state.tripReportSelectedId=t.id; } }
          );
        }
      });

    notifications.sort(function(a,b){ return a.createdAt<b.createdAt?1:(a.createdAt>b.createdAt?-1:0); });
  }

      '</div>');

      form.appendChild(autoRow);

      var totalRow=el('<div class="card" style="background:var(--surface-alt);border:1px dashed var(--border-strong);"><div style="padding:12px 16px;" class="kv-row"><span class="k">합계 청구액</span><span class="v num" id="tr-total">0원</span></div></div>');
      form.appendChild(totalRow);
      function updateTotal(){
        var sum=transportCostVal+lodgingCostVal+autoDaily+autoMeal;
        totalRow.querySelector('#tr-total').textContent = sum.toLocaleString()+'원';

        ev.preventDefault();
        var workContent=form.querySelector('#tr-work').value.trim();

          workContent:workContent, transport:transTypeSel.value, transportCost:transportCostVal,

          dailyAllowance:autoDaily, mealAllowance:autoMeal,
          status:'대기', submittedAt:TODAY, version:1, editedAt:null
        };
        toast('출장결과보고 및 출장비 청구가 상신되었습니다.');
        render();
      });
      updateTotal();
      rightCard.appendChild(form);
    }

    wrap.appendChild(listCard);
    wrap.appendChild(rightCard);
    return wrap;
  }

  /* ============ Calendar screen ============ */
  var CAL_YEAR=2026, CAL_MONTH=8; // 목업 고정 월(2026년 8월)
  var WEEKDAY_LABELS=['월','화','수','목','금','토','일'];

  function buildMonthGrid(year, month){
    var first=new Date(year, month-1, 1);
    var offset=(first.getDay()+6)%7; // 월요일 시작 기준 오프셋
    var start=new Date(year, month-1, 1-offset);
    var cells=[];
    for(var i=0;i<42;i++){
      var d=new Date(start); d.setDate(start.getDate()+i);
      cells.push(d);
    }
    return cells;
  }

  function renderCalendarScreen(){
    var wrap=el('<div class="stack"></div>');
    var card=el('<div class="card card-pad"></div>');

    var toolbar=el('<div class="cal-toolbar"></div>');
    var monthNav=el('<div style="display:flex;align-items:center;gap:10px;">'+
      '<button class="btn ghost" type="button" style="padding:6px 10px;">‹</button>'+
      '<h2 style="font-size:16px;min-width:104px;text-align:center;">'+CAL_YEAR+'년 '+CAL_MONTH+'월</h2>'+
      '<button class="btn ghost" type="button" style="padding:6px 10px;">›</button>'+
    '</div>');
    Array.prototype.forEach.call(monthNav.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){ toast('목업에서는 2026년 8월 캘린더만 제공됩니다.'); });
    });
    toolbar.appendChild(monthNav);

    var right=el('<div style="display:flex;align-items:center;gap:12px;"></div>');
    var deptSel=el('<select class="input" style="width:150px;padding:7px 10px;"></select>');
    deptSel.appendChild(el('<option value="ALL">전체 부서</option>'));
    DEPARTMENTS.forEach(function(d){ deptSel.appendChild(el('<option value="'+d.name+'">'+d.name+'</option>')); });
    deptSel.value=state.calendarDeptFilter;
    deptSel.addEventListener('change', function(){ state.calendarDeptFilter=deptSel.value; render(); });
    right.appendChild(deptSel);
    var addBtn=el('<button class="btn primary" type="button">'+ICON.plus+' 일정 등록</button>');
    addBtn.addEventListener('click', function(){ state.showEventForm=true; render(); });
    right.appendChild(addBtn);
    toolbar.appendChild(right);
    card.appendChild(toolbar);

    var legend=el('<div class="cal-legend" style="margin-bottom:12px;">'+
      '<span><span class="cal-legend-dot" style="background:var(--success);"></span>승인된 휴가</span>'+
      '<span><span class="cal-legend-dot" style="background:var(--accent);"></span>사내 일정</span>'+
    '</div>');
    card.appendChild(legend);

    var weekhead=el('<div class="cal-weekhead"></div>');
    WEEKDAY_LABELS.forEach(function(w){ weekhead.appendChild(el('<div>'+w+'</div>')); });
    card.appendChild(weekhead);

    var grid=el('<div class="cal-grid"></div>');
    var cells=buildMonthGrid(CAL_YEAR, CAL_MONTH);
    cells.forEach(function(d){
      var key=toLocalKey(d);
      var isOut = d.getMonth()!==(CAL_MONTH-1);
      var isToday = key===TODAY;
      var cell=el('<div class="cal-cell'+(isOut?' out':'')+(isToday?' today':'')+'"></div>');
      cell.appendChild(el('<div class="cal-daynum">'+d.getDate()+'</div>'));

      var leaves=leavesOnDate(key, state.calendarDeptFilter);
      var events=eventsOnDate(key, state.calendarDeptFilter);
      var items=[];
      leaves.forEach(function(l){ items.push({cls:'leave', label:l.name+' '+l.type}); });
      events.forEach(function(e){ items.push({cls:'event', label:e.title}); });

      items.slice(0,3).forEach(function(it){
        var chip=el('<button type="button" class="cal-chip '+it.cls+'">'+escapeHtml(it.label)+'</button>');
        chip.addEventListener('click', function(){ state.dayDetailKey=key; render(); });
        cell.appendChild(chip);
      });
      if(items.length>3){
        var more=el('<button type="button" class="cal-more">+'+(items.length-3)+'건 더보기</button>');
        more.addEventListener('click', function(){ state.dayDetailKey=key; render(); });
        cell.appendChild(more);
      }
      grid.appendChild(cell);
    });
    card.appendChild(grid);

    wrap.appendChild(card);
    return wrap;
  }

  function openDayDetail(key){ state.dayDetailKey=key; render(); }
  function closeDayDetail(){ state.dayDetailKey=null; render(); }

  function renderDayDetailPanel(){

  /* ============ 사내게시판(일반게시판, 공지사항 상단 고정) ============ */
  function sortedBoardPosts(){
    return BOARD_POSTS.slice().sort(function(a,b){
      if(a.isNotice!==b.isNotice) return a.isNotice ? -1 : 1;
      return a.createdAt<b.createdAt ? 1 : (a.createdAt>b.createdAt ? -1 : 0);
    });
  }

  /* ============ Attendance (출퇴근) — 대시보드 체크 카드 ============ */
  // 데모: 15:30 → 18:05 → 20:05 → 15:30 순으로 순환하며 시간대별 퇴근 체크 규칙을 체험
  var DEMO_TIME_CYCLE = ['15:30','18:05','20:05'];

  function renderAttendanceActionCard(){
    var todayRec = attendanceRecords[TODAY] || {};
    var checkedIn = !!todayRec.checkIn;
    var checkedOut = !!todayRec.checkOut;
    var overtimeApproved = hasApprovedOvertime(TODAY);
    // 18:00~19:00은 누구나 가능, 19:00 이후는 당일 승인된 초과근무 신청이 있어야 가능
    var canCheckOut = checkedIn && NOW_TIME>='18:00' && (NOW_TIME<'19:00' || overtimeApproved);

    var card=el('<div class="card card-pad"></div>');
    var head=el('<div class="card-head"><h2>오늘 출퇴근</h2></div>');
    var nowWrap=el('<div style="display:flex;align-items:center;gap:8px;"></div>');
    nowWrap.appendChild(el('<span class="now-chip">'+ICON.clock+' '+NOW_TIME+'</span>'));
    var curIdx=DEMO_TIME_CYCLE.indexOf(NOW_TIME);
    var nextTime=DEMO_TIME_CYCLE[(curIdx+1)%DEMO_TIME_CYCLE.length] || DEMO_TIME_CYCLE[0];
    var advBtn=el('<button class="btn ghost" type="button" style="padding:5px 10px;font-size:12px;">'+nextTime+' 이동(데모)</button>');
    advBtn.addEventListener('click', function(){ NOW_TIME=nextTime; toast('데모: 현재 시각을 '+nextTime+'로 이동했습니다.'); render(); });
    nowWrap.appendChild(advBtn);
    head.appendChild(nowWrap);
    card.appendChild(head);

    var lines=el('<div></div>');

    var inLine=el('<div class="att-line"></div>');
    inLine.appendChild(el('<span class="att-line-icon">'+ICON.signIn+'</span>'));
    inLine.appendChild(el('<span class="att-line-label">출근</span>'));
    inLine.appendChild(el('<span class="att-line-time'+(checkedIn?'':' pending')+'">'+(checkedIn?todayRec.checkIn:'--:--')+'</span>'));
    if(!checkedIn){
      var inBtn=el('<button class="btn primary" type="button" style="padding:4px 10px;font-size:12px;">출근 체크</button>');
      inBtn.addEventListener('click', function(){
        attendanceRecords[TODAY] = attendanceRecords[TODAY] || {};
        attendanceRecords[TODAY].checkIn = NOW_TIME;
        toast('출근이 체크되었습니다. ('+NOW_TIME+')');
        render();
      });
      inLine.appendChild(inBtn);
    } else {
      inLine.appendChild(el('<span class="pill success" style="margin-left:auto;">완료</span>'));
    }
    lines.appendChild(inLine);

    var outLine=el('<div class="att-line"></div>');
    outLine.appendChild(el('<span class="att-line-icon">'+ICON.logout+'</span>'));
    outLine.appendChild(el('<span class="att-line-label">퇴근</span>'));
    outLine.appendChild(el('<span class="att-line-time'+(checkedOut?'':' pending')+'">'+(checkedOut?todayRec.checkOut:'--:--')+'</span>'));
    if(todayRec.auto){ outLine.appendChild(el('<span class="pill neutral" style="padding:1px 7px;">자동</span>')); }
    if(!checkedOut){
      var outBtn=el('<button class="btn primary" type="button" style="padding:4px 10px;font-size:12px;" '+(!canCheckOut?'disabled':'')+'>퇴근 체크</button>');
      outBtn.addEventListener('click', function(){
        if(!canCheckOut) return;
        attendanceRecords[TODAY].checkOut = NOW_TIME;
        toast('퇴근이 체크되었습니다. ('+NOW_TIME+')');
        render();
      });
      outLine.appendChild(outBtn);
      var note = !checkedIn ? '출근 먼저'
        : NOW_TIME<'18:00' ? '18:00 이후 가능'
        : (NOW_TIME>='19:00' && !overtimeApproved) ? '19:00 이후는 초과근무 승인 필요'
        : '';
      if(note) outLine.appendChild(el('<span class="att-line-note">'+note+'</span>'));
    } else {
      outLine.appendChild(el('<span class="pill success" style="margin-left:auto;">완료</span>'));
    }
    lines.appendChild(outLine);

    card.appendChild(lines);
    return card;
  }

  function renderAttendanceDailyTable(userName){
    var card=el('<div class="card card-pad"></div>');
    card.appendChild(el('<div class="card-head"><h2>일자별 근태</h2><span class="hint">'+state.attMonth+'</span></div>'));
    var tableWrap=el('<div class="table-wrap"></div>');
    var table=el('<table><thead><tr><th>날짜</th><th>요일</th><th>출근</th><th>퇴근</th><th>상태</th></tr></thead><tbody></tbody></table>');
    var tbody=table.querySelector('tbody');
    daysInMonth(state.attMonth).forEach(function(key){
      var d=new Date(key+'T00:00:00');
      var wd=WEEKDAY_LABELS[(d.getDay()+6)%7];
      var a=getAttendanceForDay(userName, key);
      var inCell='-', outCell='-', statusCell;
      if(a.kind==='RECORD'){
        inCell=a.checkIn; outCell=a.checkOut||'-';
        statusCell = a.checkOut ? '<span class="pill success">정상</span>' : '<span class="pill warning">근무중</span>';
        if(a.auto) statusCell += ' <span class="pill neutral" style="padding:1px 7px;">자동</span>';
      } else if(a.kind==='LEAVE'){
        var unpaidTag = a.unpaid ? ' <span class="pill danger" style="padding:1px 7px;">무급</span>' : '';
        statusCell = '<span class="pill neutral">'+a.leaveType+'</span>'+unpaidTag;
      } else if(a.kind==='WEEKEND'){
        statusCell = '<span class="pill neutral">주말</span>';
      } else if(a.kind==='FUTURE'){
        statusCell = '<span class="pill neutral">예정</span>';
      } else {
        statusCell = '<span class="pill warning">미체크</span>';
      }
      var todayTag = key===TODAY ? ' (오늘)' : '';
      tbody.appendChild(el('<tr><td class="num">'+key+todayTag+'</td><td>'+wd+'</td><td class="num">'+inCell+'</td><td class="num">'+outCell+'</td><td>'+statusCell+'</td></tr>'));
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    return card;
  }

      wrap.appendChild(el('<div class="empty">해당하는 결재 건이 없습니다.</div>'));

      var tableWrap=el('<div class="table-wrap"></div>');
      var table=el('<table><thead><tr><th>유형</th><th>신청자</th><th>내용</th><th>상신일</th><th>상태</th><th></th></tr></thead><tbody></tbody></table>');

          '<td>'+a.summary+'</td>'+
          '<td class="num">'+a.submittedAt+'</td>'+
          '<td>'+statusPill(a.status)+'</td>'+

        '</tr>');
        tr.querySelector('button').addEventListener('click', function(){ openApproval(a.id); });
        tbody.appendChild(tr);

  function renderApprovalPanel(){

    kv.appendChild(el('<div class="kv-row"><span class="k">상태</span><span class="v">'+statusPill(a.status)+'</span></div>'));

    panel.appendChild(el('<hr class="divider" />'));
    if(a.type==='LEAVE'){
      panel.appendChild(el(fieldReadonly('사유', a.reason)));
    } else if(a.type==='OVERTIME'){
      panel.appendChild(el('<div class="kv-row"><span class="k">희망 퇴근시간</span><span class="v num">'+a.otFields.expectedEndTime+'</span></div>'));
      panel.appendChild(el(fieldReadonly('업무내용', a.otFields.workDetail)));
      panel.appendChild(el(fieldReadonly('사유', a.otFields.reason)));
    } else if(a.type==='TRIP'){

      panel.appendChild(el('<div class="kv-row"><span class="k">구분</span><span class="v">'+tf.tripType+'출장</span></div>'));
      panel.appendChild(el('<div class="kv-row"><span class="k">기간</span><span class="v num">'+tf.startDate+' ~ '+tf.endDate+'</span></div>'));
      panel.appendChild(el('<div class="kv-row"><span class="k">목적지</span><span class="v">'+escapeHtml(tf.destination)+'</span></div>'));
      if(tf.transport){ panel.appendChild(el('<div class="kv-row"><span class="k">교통편</span><span class="v">'+escapeHtml(tf.transport)+'</span></div>')); }
      panel.appendChild(el(fieldReadonly('출장 목적', tf.purpose)));
    } else if(a.type==='TRIP_REPORT'){
      var rf=a.trFields;
      var total=rf.transportCost+(rf.hasLodging?rf.lodgingCost:0)+rf.dailyAllowance+rf.mealAllowance;
      panel.appendChild(el('<div class="kv-row"><span class="k">교통편</span><span class="v">'+escapeHtml(rf.transport||'-')+'</span></div>'));
      panel.appendChild(el('<div class="kv-row"><span class="k">교통비</span><span class="v num">'+rf.transportCost.toLocaleString()+'원</span></div>'));
      if(rf.transportAttachmentName){
        panel.appendChild(el('<div class="upload-box filled" style="margin-top:-4px;margin-bottom:8px;">'+ICON.clip+'<span>'+escapeHtml(rf.transportAttachmentName)+'</span></div>'));
      }
      panel.appendChild(el('<div class="kv-row"><span class="k">숙박비</span><span class="v num">'+(rf.hasLodging?(rf.lodgingCost.toLocaleString()+'원'):'해당없음')+'</span></div>'));
      if(rf.hasLodging && rf.lodgingAttachmentName){
        panel.appendChild(el('<div class="upload-box filled" style="margin-top:-4px;margin-bottom:8px;">'+ICON.clip+'<span>'+escapeHtml(rf.lodgingAttachmentName)+'</span></div>'));
      }
      panel.appendChild(el('<div class="kv-row"><span class="k">일비</span><span class="v num">'+rf.dailyAllowance.toLocaleString()+'원</span></div>'));
      panel.appendChild(el('<div class="kv-row"><span class="k">식비</span><span class="v num">'+rf.mealAllowance.toLocaleString()+'원</span></div>'));
      panel.appendChild(el('<div class="kv-row"><span class="k">합계 청구액</span><span class="v num" style="color:var(--accent-strong);">'+total.toLocaleString()+'원</span></div>'));
      panel.appendChild(el(fieldReadonly('출장업무 처리내용', rf.workContent)));
    } else {
      panel.appendChild(el(fieldsBlockHtml(a.type, a.fields)));
    }

    if(a.status==='PENDING'){
      var commentField=el('<div class="field"><label for="ap-comment">결재 의견 <span style="font-weight:400;color:var(--text-faint);">(선택)</span></label><textarea class="input" id="ap-comment" rows="2" placeholder="의견을 입력하세요"></textarea></div>');
      panel.appendChild(commentField);

      var btnRow=el('<div class="btn-row" style="justify-content:stretch;"><button class="btn danger-o" type="button" style="flex:1;">반려</button><button class="btn primary" type="button" style="flex:1;">승인</button></div>');
      var rejectBtn=btnRow.children[0], approveBtn=btnRow.children[1];
      rejectBtn.addEventListener('click', function(){ decideApproval(a, 'REJECTED', commentField.querySelector('textarea').value); });
      approveBtn.addEventListener('click', function(){ decideApproval(a, 'APPROVED', commentField.querySelector('textarea').value); });
      panel.appendChild(btnRow);
    } else {
      var stampClass = a.status==='APPROVED' ? '' : 'reject';
      var stampText = a.status==='APPROVED' ? '승인' : '반려';
      panel.appendChild(el('<div><span class="stamp '+stampClass+'">'+stampText+' · '+ (a.decidedAt||'') +'</span></div>'));
      if(a.comment){ panel.appendChild(el('<div class="body-box">"'+a.comment+'"</div>')); }
    }

    overlay.appendChild(panel);
    return overlay;
  }

  function decideApproval(a, result, comment){
    a.status = result;
    a.decidedAt = TODAY;
    a.comment = comment || (result==='APPROVED' ? '승인합니다.' : '');
    toast(result==='APPROVED' ? '승인 처리되었습니다.' : '반려 처리되었습니다.');
    render();
  }

    var docField=el('<div class="field"><label for="al-doc">문서유형</label></div>');
    var docSel=el('<select class="input" id="al-doc"><option value="LEAVE">연차</option><option value="DAILY">일일업무보고</option><option value="WEEKLY">주간업무보고</option></select>');
    docSel.value=state.apLineDocType;
    docSel.addEventListener('change', function(){ state.apLineDocType=docSel.value; render(); });
    docField.appendChild(docSel);
    filterRow.appendChild(docField);

    wrap.appendChild(filterRow);

    var stepsKey=state.apLineDept+'|'+state.apLineDocType;
    var steps=APPROVAL_LINES[stepsKey] || [];

    var stepsWrap=el('<div class="stack" style="gap:10px;"></div>');
    if(steps.length===0){ stepsWrap.appendChild(el('<div class="empty">설정된 결재선이 없습니다. 단계를 추가하세요.</div>')); }
    steps.forEach(function(name, idx){
      var row=el('<div style="display:flex;align-items:center;gap:10px;">'+
        '<span class="pill neutral" style="flex:none;">'+(idx+1)+'단계</span>'+
        '<input class="input" type="text" value="'+escapeHtml(name)+'" />'+
      '</div>');
      var input=row.querySelector('input');
      input.addEventListener('change', function(){ steps[idx]=input.value; });
      var delBtn=el('<button class="btn ghost" type="button" style="flex:none;color:var(--danger);">'+ICON.trash+'</button>');
      delBtn.addEventListener('click', function(){ steps.splice(idx,1); render(); });
      row.appendChild(delBtn);
      stepsWrap.appendChild(row);
    });
    wrap.appendChild(stepsWrap);

    var addStepBtn=el('<div style="margin-top:14px;"><button class="btn" type="button">'+ICON.plus+' 단계 추가</button></div>');
    addStepBtn.querySelector('button').addEventListener('click', function(){
      if(!APPROVAL_LINES[stepsKey]) APPROVAL_LINES[stepsKey]=[];

      render();
    });
    wrap.appendChild(addStepBtn);

    var saveBtn=el('<div class="btn-row" style="margin-top:18px;"><button class="btn primary" type="button">저장</button></div>');
    saveBtn.querySelector('button').addEventListener('click', function(){ toast('결재선이 저장되었습니다.'); });
    wrap.appendChild(saveBtn);

    return wrap;
  }

    var tBody=tTable.querySelector('tbody');

      var catTd=el('<td></td>');
      var catSel=el('<select class="input" style="width:150px;padding:6px 8px;"><option value="ANNUAL_DEDUCT">연차 차감형</option><option value="SPECIAL">특별휴가</option><option value="OFFICIAL">공가</option></select>');
      catSel.value=t.category;
      catSel.addEventListener('change', function(){ t.category=catSel.value; });

  /* ============ 공용: 편집 가능한 표 섹션 ============ */
  // dateRange: {startKey, endKey} — 지정 시 종료일 컬럼이 시작일 이전으로 선택되지 않도록 제약
  function editableTableSection(title, rows, columns, newRowFactory, dateRange){
    var card=el('<div class="card card-pad"></div>');
    card.appendChild(el('<div class="card-head"><h2>'+title+'</h2></div>'));
    var tableWrap=el('<div class="table-wrap"></div>');
    var theadHtml='<tr>'+columns.map(function(c){return '<th>'+c.label+'</th>';}).join('')+'<th></th></tr>';
    var table=el('<table><thead>'+theadHtml+'</thead><tbody></tbody></table>');
    var tbody=table.querySelector('tbody');
    if(rows.length===0){
      tbody.appendChild(el('<tr><td colspan="'+(columns.length+1)+'"><div class="empty">등록된 항목이 없습니다. 아래 "추가" 버튼으로 입력하세요.</div></td></tr>'));
    }
    rows.forEach(function(row, idx){
      var tr=el('<tr></tr>');
      var endFieldRef=null; // dateRange의 종료일 필드를 시작일 핸들러에서 참조하기 위한 지연 바인딩
      columns.forEach(function(c){
        var td=el('<td style="min-width:130px;"></td>');
        if(c.type==='date'){
          var isStart=dateRange && c.key===dateRange.startKey;
          var isEnd=dateRange && c.key===dateRange.endKey;
          var dg=makeDateField(row[c.key]||'', function(v){
            row[c.key]=v;
            if(isStart && endFieldRef){
              endFieldRef.setMin(v);
              var ev=endFieldRef.getValue();
              if(ev && v && ev<v){ endFieldRef.setValue(v); row[dateRange.endKey]=v; }
            }
            if(isEnd){
              var sv=row[dateRange.startKey];
              if(sv && v && v<sv){ dg.setValue(sv); row[c.key]=sv; }
            }
          });
          if(isStart) dg.setMin(''); // 시작일 자체는 제약 없음
          if(isEnd){ dg.setMin(row[dateRange.startKey]||''); endFieldRef=dg; }
          td.appendChild(dg.el);
        } else {
          var inp=el('<input class="input" type="text" value="'+escapeHtml(row[c.key]||'')+'" />');
          if(c.format==='phone'){
            attachPhoneFormat(inp, row, c.key);
          } else {
            inp.addEventListener('change', function(){ row[c.key]=inp.value; });
          }
          td.appendChild(inp);
        }
        tr.appendChild(td);
      });
      var delTd=el('<td style="text-align:right;"></td>');
      var delBtn=el('<button class="btn ghost" type="button" style="color:var(--danger);">'+ICON.trash+'</button>');
      delBtn.addEventListener('click', function(){ rows.splice(idx,1); render(); });
      delTd.appendChild(delBtn);
      tr.appendChild(delTd);
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    var addBtn=el('<div style="margin-top:14px;"><button class="btn" type="button">'+ICON.plus+' 추가</button></div>');
    addBtn.querySelector('button').addEventListener('click', function(){ rows.push(newRowFactory()); render(); });
    card.appendChild(addBtn);
    return card;
  }

  /* ============ 인사기록카드(표준서식) ============ */
  function renderHrRecordScreen(){
    var wrap=el('<div class="stack"></div>');

    function bindField(label, key, type, format){
      if(type==='date'){
        var df=el('<div class="field"><label>'+label+'</label></div>');
        var dg=makeDateField(HR_RECORD[key]||'', function(v){ HR_RECORD[key]=v; });
        df.appendChild(dg.el);
        return df;
      }
      var f=el('<div class="field"><label>'+label+'</label><input class="input" type="text" value="'+escapeHtml(HR_RECORD[key]||'')+'" /></div>');
      var inp=f.querySelector('input');
      if(format==='phone'){
        attachPhoneFormat(inp, HR_RECORD, key);
      } else {
        inp.addEventListener('change', function(e){ HR_RECORD[key]=e.target.value; });
      }
      return f;
    }

    var head=el('<div class="card card-pad"><div class="card-head"><h2>기본 인적사항</h2><span class="hint">표준서식</span></div></div>');
    var basicGrid=el('<div style="display:grid;grid-template-columns:132px 1fr;gap:20px;align-items:start;"></div>');
    var photoBox=el('<div class="upload-box" style="flex-direction:column;height:150px;justify-content:center;cursor:pointer;text-align:center;">'+ICON.upload+'<span style="margin-top:6px;">사진 등록</span></div>');
    photoBox.addEventListener('click', function(){ toast('목업에서는 사진 업로드가 비활성화되어 있습니다.'); });
    basicGrid.appendChild(photoBox);

    var fieldsWrap=el('<div class="form-grid"></div>');
    fieldsWrap.appendChild(bindField('성명(한글)','nameKr'));
    fieldsWrap.appendChild(bindField('성명(영문)','nameEn'));
    fieldsWrap.appendChild(bindField('생년월일','birth','date'));
    var genderField=el('<div class="field"><label>성별</label></div>');
    var genderSel=el('<select class="input"><option value="남">남</option><option value="여">여</option></select>');
    genderSel.value=HR_RECORD.gender;
    genderSel.addEventListener('change', function(){ HR_RECORD.gender=genderSel.value; });
    genderField.appendChild(genderSel);
    fieldsWrap.appendChild(genderField);
    fieldsWrap.appendChild(bindField('휴대전화','mobile',null,'phone'));
    fieldsWrap.appendChild(bindField('이메일','email'));
    basicGrid.appendChild(fieldsWrap);
    head.appendChild(basicGrid);

    var addrField=bindField('주소','address');
    addrField.style.marginTop='16px';
    head.appendChild(addrField);

    var emgRow=el('<div class="field-row" style="margin-top:16px;"></div>');
    emgRow.appendChild(bindField('비상연락처 관계','emergencyRelation'));
    emgRow.appendChild(bindField('비상연락처 성명','emergencyName'));
    emgRow.appendChild(bindField('비상연락처 전화','emergencyPhone',null,'phone'));
    head.appendChild(emgRow);
    wrap.appendChild(head);

    wrap.appendChild(editableTableSection('학력사항', HR_RECORD.education, [
      { key:'school', label:'학교명' }, { key:'major', label:'전공' }, { key:'degree', label:'구분' },
      { key:'admissionDate', label:'입학일', type:'date' }, { key:'graduationDate', label:'졸업일', type:'date' }
    ], function(){ return { school:'', major:'', degree:'', admissionDate:'', graduationDate:'' }; },
    { startKey:'admissionDate', endKey:'graduationDate' }));

    wrap.appendChild(editableTableSection('경력사항', HR_RECORD.career, [
      { key:'company', label:'회사명' }, { key:'position', label:'직위/부서' },
      { key:'startDate', label:'입사일', type:'date' }, { key:'endDate', label:'퇴사일', type:'date' }, { key:'duty', label:'담당업무' }
    ], function(){ return { company:'', position:'', startDate:'', endDate:'', duty:'' }; },
    { startKey:'startDate', endKey:'endDate' }));

    wrap.appendChild(editableTableSection('자격/면허사항', HR_RECORD.certificates, [
      { key:'name', label:'자격명' }, { key:'date', label:'취득일', type:'date' }, { key:'issuer', label:'발급기관' }
    ], function(){ return { name:'', date:'', issuer:'' }; }));

    var milCard=el('<div class="card card-pad"></div>');
    milCard.appendChild(el('<div class="card-head"><h2>병역사항</h2></div>'));
    var milGrid=el('<div class="form-grid"></div>');
    var statusField=el('<div class="field"><label>병역구분</label></div>');
    var statusSel=el('<select class="input"><option>해당없음</option><option>군필</option><option>미필</option><option>면제</option></select>');
    statusSel.value=HR_RECORD.militaryStatus;
    statusSel.addEventListener('change', function(){ HR_RECORD.militaryStatus=statusSel.value; render(); });
    statusField.appendChild(statusSel);
    milGrid.appendChild(statusField);
    if(HR_RECORD.militaryStatus==='군필'){
      milGrid.appendChild(bindField('군별','militaryBranch'));
      milGrid.appendChild(bindField('계급','militaryRank'));
      milGrid.appendChild(bindField('복무기간','militaryPeriod'));
    }
    milCard.appendChild(milGrid);
    wrap.appendChild(milCard);

    wrap.appendChild(editableTableSection('가족사항', HR_RECORD.family, [
      { key:'relation', label:'관계' }, { key:'name', label:'성명' }, { key:'birth', label:'생년월일', type:'date' }, { key:'cohabit', label:'동거여부' }
    ], function(){ return { relation:'', name:'', birth:'', cohabit:'동거' }; }));

    var agreeCard=el('<div class="card card-pad"></div>');
    var agreeRow=el('<label class="checkbox-row"><input type="checkbox" /><span>상기 기재사항은 사실과 다름없음을 서약합니다.</span></label>');
    agreeRow.querySelector('input').checked=HR_RECORD.agreed;
    agreeRow.querySelector('input').addEventListener('change', function(e){ HR_RECORD.agreed=e.target.checked; });
    agreeCard.appendChild(agreeRow);
    if(HR_RECORD.submittedAt){
      agreeCard.appendChild(el('<div class="helptext" style="margin-top:8px;">마지막 저장: '+HR_RECORD.submittedAt+'</div>'));
    }
    var saveBtn=el('<div class="btn-row" style="margin-top:16px;"><button class="btn primary" type="button">저장</button></div>');
    saveBtn.querySelector('button').addEventListener('click', function(){
      if(!HR_RECORD.agreed){ toast('서약에 동의해야 저장할 수 있습니다.'); return; }
      HR_RECORD.submittedAt=TODAY;
      toast('인사기록카드가 저장되었습니다.');
      render();
    });
    agreeCard.appendChild(saveBtn);
    wrap.appendChild(agreeCard);

    return wrap;
  }

  seedNotifications();
  render();
})();
</script>
