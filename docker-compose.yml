services:
  postgres:
    image: postgres:16-alpine
    container_name: nugw-postgres
    environment:
      POSTGRES_DB: nugw
      POSTGRES_USER: nugw
      POSTGRES_PASSWORD: nugw-pg-2026!
    ports:
      # 로컬 개발(호스트)에서도 접속할 수 있도록 5433으로 노출한다(로컬에 이미 5432가 떠 있을 수 있어 충돌 방지).
      - "5433:5432"
    volumes:
      - nugw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nugw -d nugw"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nugw:
    build: .
    image: nugw:latest
    container_name: nugw
    # module-22: 출퇴근 체크 사내망(IP) 제한을 위해 실제 클라이언트 IP를 알아야 하는데, Next.js Route
    # Handler는 raw 소켓에 접근할 수 없다. 그래서 호스트에는 이 컨테이너를 직접 노출하지 않고(포트 미publish),
    # 아래 nginx 리버스 프록시가 X-Real-IP/X-Forwarded-For를 채워 넘겨준 뒤에만 접근하도록 한다.
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://nugw:nugw-pg-2026!@postgres:5432/nugw
      # 이 앱은 평문 HTTP만 서비스한다. 나중에 nginx 앞단에 실제 인증서를 붙여 HTTPS로 전환하게 되면
      # COOKIE_SECURE=true로 바꿔 세션 쿠키에 Secure 속성을 다시 켠다(lib/auth/session.ts 참고).
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 업로드 파일(증빙 등)만 별도 볼륨에 영속화한다. 데이터는 이제 Postgres(nugw-pgdata)에 저장된다.
      - nugw-uploads:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nugw-nginx
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nugw
    restart: unless-stopped

volumes:
  nugw-pgdata:
  nugw-uploads:
