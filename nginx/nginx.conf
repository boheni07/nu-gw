# nuGW 리버스 프록시 — 출퇴근 체크 사내망 제한(module-22)을 위해 실제 클라이언트 IP를
# X-Real-IP / X-Forwarded-For 헤더로 nugw 앱 컨테이너에 전달한다.
# (Next.js Route Handler는 자체적으로 raw TCP 소켓의 remoteAddress에 접근할 수 없어,
#  프록시가 반드시 이 헤더를 채워줘야 lib/net/ip.ts의 IP 판별이 동작한다.)
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  client_max_body_size 20m;

  upstream nugw_app {
    server nugw:3000;
  }

  server {
    listen 3000;

    location / {
      proxy_pass http://nugw_app;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Next.js dev overlay/websocket(HMR)은 프로덕션에서 쓰지 않지만, 업그레이드 요청은 그대로 통과시킨다.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
